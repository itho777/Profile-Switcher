name: Build & Release Android

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter JDK
        run: flutter config --jdk-dir $JAVA_HOME

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Prepare local.properties
        run: |
          touch android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        id: build_apk
        run: flutter build apk --release 2>&1 | tee /tmp/flutter_build_apk.log; exit ${PIPESTATUS[0]}

      - name: Build Android Release AAB
        id: build_aab
        run: flutter build appbundle --release 2>&1 | tee /tmp/flutter_build_aab.log; exit ${PIPESTATUS[0]}

      - name: Dump build log on failure
        if: failure()
        run: |
          for log in /tmp/flutter_build_apk.log /tmp/flutter_build_aab.log; do
            [ -f "$log" ] || continue
            echo "## ❌ Build Error: $log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E -A3 "(error:|FAILURE|Exception|Caused by|BUILD FAILED|What went wrong|> Task|Could not)" "$log" | tail -120 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 100 lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 "$log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            /tmp/flutter_build_apk.log
            /tmp/flutter_build_aab.log
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: profile-switcher-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: profile-switcher-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
